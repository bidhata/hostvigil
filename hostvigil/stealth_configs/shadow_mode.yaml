# HostVigil - SHADOW MODE Configuration
# Balanced Stealth + Detail
# Use Case: Standard red team engagement, 2-4 week timeline

hostvigil:
  discovery:
    # Priority targets first
    target_ranges: []  # FILL IN: Start with DCs, then expand
    # Examples:
    # - "10.0.100.0/24"  # Domain controllers
    # - "10.0.101.0/24"  # Application servers
    
    wave_enabled: true
    wave_size: 50           # 50 hosts/wave
    wave_delay_seconds: 600 # 10 min between waves
    
    techniques:
      - "arp_sweep"
      - "dns_reverse_walk"
      - "passive_sniff"
  
  scanner:
    mode: two_phase
    
    naabu:
      rate: 75                   # Moderate - blends with dev traffic
      threads: 25                # Moderate threads
    
    nmap:
      phase2_only: true
      version_detection: true
      os_detection: true
      scripts: false        # NSE too noisy
      timing: T2            # Sneaky
  
  nuclei:
    auto_run: true
    run_on_web_hosts: true
    severity_filter: ["critical", "high"]  # Only important vulns
    rate_limit: 10          # Very slow
    concurrency: 2
    templates:
      exclude: ["dos", "fuzz", "intrusive"]
  
  service_enum:
    enabled: true
    grab_banners: true
    http_enumeration: false   # Too noisy
    smb_enumeration: true     # LDAP queries are quiet
    ldap_enumeration: true
  
  tls_inspection:
    enabled: true
    extract_certs: true
  
  os_fingerprint:
    enabled: true
    active: false           # Passive only for stealth
  
  pipeline:
    mode: wave
    wave_size: 50
    parallel_phases: false
    nuclei_on_web_discovery: true
  
  stealth:
    min_delay: 120.0
    max_delay: 600.0
    jitter_factor: 0.5
    scan_window_enabled: true
    scan_window_start: 9
    scan_window_end: 17
  
  logging:
    level: "INFO"
    remote_syslog: false
    file_path: "data/ops.log"
  
  abort_conditions:
    honeypot_detected: true
    scan_blocked_count: 10
    error_rate_threshold: 0.3

# Expected:
# - 50 hosts/hour = 1,200 hosts/day
# - 200K hosts in ~6-7 months
# - Detection risk: 🟡 LOW-MEDIUM
