# ============================================================================
# HostVigil Default Configuration — Small / Mid-Size Networks (50–5,000 hosts)
# ============================================================================
#
# This config is tuned for stealth-first operation on SOC-monitored networks.
# It prioritizes remaining invisible to blue team defenses over raw speed.
#
# For enterprise networks (200k+ hosts) where speed matters more than stealth,
# use entp_config.yaml instead:
#   python run.py -c entp_config.yaml daemon
#
# ============================================================================

hostvigil:
  dashboard:
    host: '127.0.0.1'             # Localhost only — never expose to network
    port: 5000
    refresh_interval: 30
    secret_key: change-this-in-production

  database:
    path: data/hostvigil.db

  # --------------------------------------------------------------------------
  # Discovery — How HostVigil finds live hosts
  # --------------------------------------------------------------------------
  discovery:
    target_ranges:
      - '192.168.0.0/16'           # Adjust to your actual network
      # - '10.0.0.0/8'            # Uncomment for larger internal ranges
      # - '172.16.0.0/12'         # Uncomment if applicable
    techniques:
      # Ordered: fast first, slow/passive last
      - nmap_discover              # nmap -sn (finds hosts in seconds)
      - nbns_query                 # Windows host discovery
      - mdns_enum                  # .local service queries (printers, macOS, IoT)
      - ssdp_discover              # UPnP multicast (routers, NAS)
      - tcp_syn_discover           # Lightweight alive check
      - snmp_sweep                 # Community string probes (slow, stealthy)
      - dns_reverse_walk           # PTR lookups with heavy jitter
      - passive_sniff              # Zero packets sent — just listens
      - dhcp_passive               # Captures DHCP traffic silently
      # - dns_custom              # Enable if you have internal DNS (set dns_custom_server)
    # nmap host-discovery settings — stealth-tuned
    nmap_timing: 'T2'              # T2 = polite (slower, less detectable)
    nmap_extra_args: ['-PE', '-PS22,80,135,139,443,445,3389,5985', '-PU137', '--min-rate', '100', '--max-rate', '300', '--max-retries', '1', '-n']
    nmap_parallel_chunks: 1        # Single nmap process (quietest)
    nmap_disable_arp_ping: false
    nmap_scan_timeout: 1800        # 30 min timeout per chunk
    nmap_max_chunks: 256
    # Passive technique durations
    passive_sniff_duration: 120    # Listen for 2 minutes
    dhcp_sniff_duration: 60
    # SNMP sweep
    snmp_communities: ['public', 'private']
    snmp_delay: 45.0               # 45s+ between SNMP probes
    # Custom DNS discovery
    dns_custom_server: ''          # Internal DNS server IP (empty = disabled)
    dns_custom_domain: ''          # Domain for zone transfer attempts

  # --------------------------------------------------------------------------
  # Scanner — Port scanning and service detection
  # --------------------------------------------------------------------------
  scanner:
    mode: 'nmap_only'              # 'nmap_only' (stealth) or 'two_phase' (naabu→nmap, fast but noisy)
    scan_type: 'connect'           # 'connect' (no root needed) or 'syn' (root, stealthier on wire)
    port_profile: 'standard'       # standard = 19 ports (manageable for <5000 hosts)
    udp_scan_enabled: true         # UDP scanning (DNS, SNMP, NTP, SSDP, mDNS)
    udp_profile: 'standard'
    banner_grab: true
    banner_timeout: 2.0
    connect_timeout: 1.5
    naabu:                         # Only used when mode is 'two_phase'
      rate: 1000                   # Low rate for stealth
      threads: 10                  # Low concurrency
    nmap:
      version_detection: true
      os_detection: false
      timing: 'T2'
    ports:
      quick: [22, 80, 443, 445, 3389]
      standard: [22, 53, 80, 88, 135, 139, 389, 443, 445, 636, 1433, 3306, 3389, 5432, 5985, 5986, 8080, 8443, 9200]
      full: [21, 22, 23, 25, 53, 80, 88, 110, 111, 135, 139, 143, 389, 443, 445, 465, 514, 587, 636, 993, 995, 1080, 1433, 1521, 2049, 2375, 2376, 3306, 3389, 5432, 5900, 5985, 5986, 6379, 8080, 8443, 8888, 9090, 9200, 9300, 11211, 27017]
    udp_ports:
      quick: [53, 123, 161, 500, 1900]
      standard: [53, 67, 68, 69, 123, 137, 138, 161, 162, 500, 514, 520, 1194, 1900, 4500, 5353]

  # --------------------------------------------------------------------------
  # Deep service/version detection (nmap -sV) — operator-triggered only
  # --------------------------------------------------------------------------
  service_scan:
    enabled: true
    version_intensity: 5           # 0-9 (lower = quieter, higher = thorough)
    nmap_timing: 'T2'              # Polite timing
    scan_delay: ''                 # e.g. '1s' for extra stealth
    parallel: 4                    # Concurrent nmap processes (1 = quietest)
    scan_timeout: 300              # Per-host subprocess timeout (seconds)

  # --------------------------------------------------------------------------
  # Stealth — Timing and evasion parameters
  # --------------------------------------------------------------------------
  stealth:
    min_delay: 10.0                # Seconds between probes (raise for more stealth)
    max_delay: 45.0                # Maximum randomized delay
    jitter_factor: 0.3             # Timing randomization (0-1)
    max_threads: 3                 # Concurrent scan threads (low = stealthy)
    packet_fragmentation: true     # Fragment packets to evade DPI
    randomize_scan_order: true     # No sequential patterns
    ttl_manipulation: true         # Random TTL values
    scan_window_enabled: false     # Set true to only scan during business hours
    scan_window_start: 8           # 8 AM (blends with normal traffic)
    scan_window_end: 18            # 6 PM
    decoy_ips: ['10.0.0.1', '10.0.0.254', '172.16.0.1', '192.168.1.1', '100.64.0.1', '198.18.0.1']

  # --------------------------------------------------------------------------
  # ML Engine — Self-learning anomaly detection
  # --------------------------------------------------------------------------
  ml_engine:
    anomaly_threshold: 0.7
    min_training_samples: 50       # Rules work immediately; ML after 50 data points
    model_path: data/models/
    training_interval_hours: 24

  # --------------------------------------------------------------------------
  # Nuclei — Vulnerability scanning (manual trigger recommended for stealth)
  # --------------------------------------------------------------------------
  nuclei:
    auto_run: false                # Disabled by default — Nuclei is noisy
    min_targets: 20                # Minimum web hosts before firing
    binary_path: nuclei
    update_templates: false        # Stealth: don't phone home to GitHub before each scan
    severity_filter: ['critical', 'high', 'medium']
    rate_limit: 10                 # Low rate for stealth
    concurrency: 2                 # Low concurrency
    bulk_size: 5
    retries: 1
    timeout: 15
    run_interval_hours: 6

  # --------------------------------------------------------------------------
  # OS Fingerprinting
  # --------------------------------------------------------------------------
  os_fingerprint:
    enabled: true
    active_probing: true           # Active TCP probes for better accuracy on small nets
    confidence_threshold: 0.4

  # --------------------------------------------------------------------------
  # TLS Inspection
  # --------------------------------------------------------------------------
  tls_inspection:
    enabled: true
    ports: [443, 636, 993, 995, 465, 8443, 5986, 2376, 9443]
    check_expiry: true
    check_weak_ciphers: true
    check_protocol_versions: true
    timeout: 5.0

  # --------------------------------------------------------------------------
  # Service Enumeration (SMB, LDAP, Redis, Docker, Elasticsearch)
  # --------------------------------------------------------------------------
  service_enum:
    enabled: true
    smb_enum: true
    ldap_enum: true
    redis_check: true
    elasticsearch_check: true
    docker_check: true
    winrm_check: true
    timeout: 5.0

  # --------------------------------------------------------------------------
  # Parallel Discovery + Port Scanning (enterprise feature)
  # --------------------------------------------------------------------------
  # When enabled, naabu fires on batches of hosts AS they are discovered,
  # instead of waiting for the entire discovery phase to complete first.
  # Not needed for small/mid networks where discovery finishes in minutes.
  # See entp_config.yaml for recommended enterprise settings.
  parallel_scan:
    enabled: false                 # Enable for large networks (200k+ hosts)
    batch_size: 100                # Fire naabu scan every N newly-discovered hosts
    scan_interval_sec: 30          # Check for new hosts to scan every N seconds
    max_scan_threads: 2            # Concurrent scan batches

  # --------------------------------------------------------------------------
  # Scheduler — How often each phase repeats in daemon mode
  # --------------------------------------------------------------------------
  scheduler:
    discovery_interval_hours: 4    # Re-discover every 4 hours
    scan_interval_hours: 2         # Re-scan ports every 2 hours
    service_enum_interval_hours: 8
    tls_inspection_interval_hours: 12
    os_fingerprint_interval_hours: 12
